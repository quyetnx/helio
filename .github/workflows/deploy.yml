# Install or update Helio on the server this self-hosted runner lives on (a
# Docker Compose install managed via ~/.helio/helio). The job runs ON the
# server, so no SSH keys or kubeconfig are stored in GitHub.
#
# First run installs; later runs update (`helio update` takes a pre-update DB
# backup, applies the bundle and migrates; a failed backup/migration aborts).
# Release bundles and images come from this repo's own releases (release.yml
# builds ghcr.io/<owner>/helio-* and the bundle on every v* tag). Set the
# HELIO_REPO Variable only to deploy from a different repo.
#
# Setup: a runner labelled `helio-deploy` whose user can run docker and owns
# $HOME/.helio; Variables APP_URL (e.g. https://mailbot.io.vn) and optionally
# PUBLIC_TRACKING_URL / HELIO_REPO on the `production` environment, where you
# can also add required reviewers to gate deploys.
name: deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v2.3.1); empty = latest
        required: false
        default: ''
      profile:
        description: full (~8 GB RAM) or core (~2.5 GB RAM) — used on first install only
        type: choice
        options: [full, core]
        default: full

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, helio-deploy]
    environment: production
    timeout-minutes: 60
    env:
      # Never interpolate input into the shell; it goes through env.
      VERSION: ${{ inputs.version }}
      PROFILE: ${{ inputs.profile }}
      HELIO_REPO: ${{ vars.HELIO_REPO || github.repository }}
      APP_URL: ${{ vars.APP_URL }}
      PUBLIC_TRACKING_URL: ${{ vars.PUBLIC_TRACKING_URL }}
      HELIO_YES: '1'
      HELIO_NO_BROWSER: '1'
    steps:
      - name: Validate inputs
        run: |
          set -eu
          [ -z "$VERSION" ] || printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$'
          printf '%s' "$HELIO_REPO" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'
          [ -n "$APP_URL" ] || { echo "set the APP_URL variable (e.g. https://mailbot.io.vn)" >&2; exit 1; }
          printf '%s' "$APP_URL" | grep -Eq '^https?://[A-Za-z0-9.:-]+$' \
            || { echo "APP_URL must be scheme://host[:port], no trailing slash" >&2; exit 1; }
      - name: Log in to GHCR
        # Images are private until the packages are made public; this job's
        # token can read the packages release.yml pushed for this repo.
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Install or update Helio
        run: |
          set -eu
          HELIO="$HOME/.helio/helio"
          if [ -x "$HELIO" ]; then
            "$HELIO" update ${VERSION:+--version "$VERSION"} --yes
          else
            export HELIO_APP_URL="$APP_URL"
            curl -fsSL "https://raw.githubusercontent.com/$HELIO_REPO/main/scripts/install.sh" -o "$RUNNER_TEMP/install.sh"
            sh "$RUNNER_TEMP/install.sh" install --yes \
              ${VERSION:+--version "$VERSION"} \
              $([ "$PROFILE" = core ] && echo --core)
          fi
      - name: Apply public URLs from GitHub Variables
        # `helio update` only appends new keys to .env, so values that live in
        # Variables are synced here. The stack restarts only on a change.
        run: |
          set -eu
          ENV_FILE="$HOME/.helio/.env"
          changed=0
          sync() {
            key="$1"; val="$2"
            [ -n "$val" ] || return 0
            printf '%s' "$val" | grep -Eq '^https?://[A-Za-z0-9.:-]+$' \
              || { echo "refusing $key: must be scheme://host[:port], no trailing slash" >&2; exit 1; }
            if grep -qx "$key=$val" "$ENV_FILE"; then return 0; fi
            if grep -q "^$key=" "$ENV_FILE"; then
              sed -i "s|^$key=.*|$key=$val|" "$ENV_FILE"
            else
              printf '%s=%s\n' "$key" "$val" >> "$ENV_FILE"
            fi
            changed=1
          }
          sync APP_URL "$APP_URL"
          sync PUBLIC_TRACKING_URL "$PUBLIC_TRACKING_URL"
          if [ "$changed" = 1 ]; then
            "$HOME/.helio/helio" stop && "$HOME/.helio/helio" start
          fi
      - name: Status
        run: '"$HOME/.helio/helio" status'
